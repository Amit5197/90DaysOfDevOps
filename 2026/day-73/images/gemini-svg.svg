<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 620" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="promGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="lokiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="otelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grafanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowMetrics" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f97316"/>
    </marker>
    <marker id="arrowLogs" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowTraces" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a855f7"/>
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Headers -->
  <text x="40" y="45" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">Full-Stack Observability Pipeline</text>
  <text x="40" y="68" fill="#94a3b8" font-size="13">Metrics (Prometheus) • Logs (Loki) • Traces (OpenTelemetry) • Visualization (Grafana)</text>

  <!-- Column Background Trackers -->
  <rect x="35" y="90" width="180" height="495" rx="8" fill="#161b22" opacity="0.6"/>
  <text x="50" y="115" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">1. DATA SOURCES</text>

  <rect x="270" y="90" width="200" height="495" rx="8" fill="#161b22" opacity="0.6"/>
  <text x="285" y="115" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">2. COLLECTORS / AGENTS</text>

  <rect x="545" y="90" width="250" height="495" rx="8" fill="#161b22" opacity="0.6"/>
  <text x="560" y="115" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">3. STORAGE &amp; PROCESSING</text>

  <rect x="880" y="90" width="230" height="495" rx="8" fill="#161b22" opacity="0.6"/>
  <text x="895" y="115" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">4. VISUALIZATION</text>

  <!-- Connectors -->
  <!-- Host -> Node Exporter -->
  <path d="M 195 165 L 290 165" stroke="#f97316" stroke-width="2" marker-end="url(#arrowMetrics)"/>
  <!-- Docker -> cAdvisor -->
  <path d="M 195 265 L 290 265" stroke="#f97316" stroke-width="2" marker-end="url(#arrowMetrics)"/>
  <!-- App Metrics -> Prometheus -->
  <path d="M 195 385 C 380 385, 380 230, 560 215" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowMetrics)"/>
  <!-- App Logs -> Promtail -->
  <path d="M 195 415 L 290 415" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowLogs)"/>
  <!-- App Traces -> OTEL Collector -->
  <path d="M 195 440 C 230 440, 240 525, 290 525" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowTraces)"/>

  <!-- Node Exporter -> Prometheus -->
  <path d="M 450 165 C 500 165, 510 195, 560 195" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrowMetrics)"/>
  <!-- cAdvisor -> Prometheus -->
  <path d="M 450 265 C 500 265, 510 210, 560 210" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrowMetrics)"/>
  <!-- Promtail -> Loki -->
  <path d="M 450 415 L 565 415" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowLogs)"/>
  <!-- OTEL Collector -> Backend/Grafana -->
  <path d="M 450 525 C 670 525, 710 395, 900 340" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowTraces)"/>

  <!-- Prometheus -> Grafana -->
  <path d="M 745 205 C 820 205, 830 300, 900 310" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrowMetrics)"/>
  <!-- Loki -> Grafana -->
  <path d="M 725 415 C 810 415, 830 330, 900 325" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowLogs)"/>

  <!-- LABELS ON PATHS -->
  <!-- metrics tags -->
  <rect x="220" y="152" width="48" height="18" rx="4" fill="#2d1d13" stroke="#f97316" stroke-width="1"/>
  <text x="244" y="165" fill="#fdba74" font-size="10" font-weight="600" text-anchor="middle">metrics</text>

  <rect x="220" y="252" width="48" height="18" rx="4" fill="#2d1d13" stroke="#f97316" stroke-width="1"/>
  <text x="244" y="265" fill="#fdba74" font-size="10" font-weight="600" text-anchor="middle">metrics</text>

  <rect x="360" y="300" width="48" height="18" rx="4" fill="#2d1d13" stroke="#f97316" stroke-width="1"/>
  <text x="384" y="313" fill="#fdba74" font-size="10" font-weight="600" text-anchor="middle">metrics</text>

  <rect x="220" y="406" width="38" height="18" rx="4" fill="#0c2d48" stroke="#38bdf8" stroke-width="1"/>
  <text x="239" y="419" fill="#7dd3fc" font-size="10" font-weight="600" text-anchor="middle">logs</text>

  <rect x="220" y="480" width="44" height="18" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="242" y="493" fill="#d8b4fe" font-size="10" font-weight="600" text-anchor="middle">traces</text>

  <!-- 1. DATA SOURCES BOXES -->
  <!-- Host -->
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="140" height="60" rx="8" fill="url(#hostGrad)" stroke="#374151" stroke-width="1.5"/>
    <text x="125" y="162" fill="#f9fafb" font-size="14" font-weight="600" text-anchor="middle">Host Machine</text>
    <text x="125" y="180" fill="#9ca3af" font-size="10" text-anchor="middle">CPU, RAM, Disk, OS</text>
  </g>

  <!-- Docker -->
  <g filter="url(#shadow)">
    <rect x="55" y="235" width="140" height="60" rx="8" fill="url(#hostGrad)" stroke="#374151" stroke-width="1.5"/>
    <text x="125" y="262" fill="#f9fafb" font-size="14" font-weight="600" text-anchor="middle">Docker Daemon</text>
    <text x="125" y="280" fill="#9ca3af" font-size="10" text-anchor="middle">Container runtime</text>
  </g>

  <!-- App -->
  <g filter="url(#shadow)">
    <rect x="55" y="375" width="140" height="85" rx="8" fill="url(#hostGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="125" y="405" fill="#f9fafb" font-size="14" font-weight="600" text-anchor="middle">App Service</text>
    <text x="125" y="423" fill="#38bdf8" font-size="10" text-anchor="middle">(e.g., notes-app)</text>
    <text x="125" y="442" fill="#9ca3af" font-size="9" text-anchor="middle">Instrumented runtime</text>
  </g>

  <!-- 2. COLLECTORS BOXES -->
  <!-- Node Exporter -->
  <g filter="url(#shadow)">
    <rect x="290" y="135" width="160" height="60" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <text x="370" y="162" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Node Exporter</text>
    <text x="370" y="180" fill="#cbd5e1" font-size="10" text-anchor="middle">:9100 /metrics</text>
  </g>

  <!-- cAdvisor -->
  <g filter="url(#shadow)">
    <rect x="290" y="235" width="160" height="60" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <text x="370" y="262" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">cAdvisor</text>
    <text x="370" y="280" fill="#cbd5e1" font-size="10" text-anchor="middle">:8080 /metrics</text>
  </g>

  <!-- Promtail -->
  <g filter="url(#shadow)">
    <rect x="290" y="385" width="160" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="370" y="412" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Promtail</text>
    <text x="370" y="430" fill="#cbd5e1" font-size="10" text-anchor="middle">Log shipping agent</text>
  </g>

  <!-- OTEL Collector -->
  <g filter="url(#shadow)">
    <rect x="290" y="495" width="160" height="60" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="370" y="522" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">OTEL Collector</text>
    <text x="370" y="540" fill="#cbd5e1" font-size="10" text-anchor="middle">Traces / Telemetry bus</text>
  </g>

  <!-- 3. STORAGE BOXES -->
  <!-- Prometheus -->
  <g filter="url(#shadow)">
    <rect x="565" y="170" width="180" height="75" rx="8" fill="url(#promGrad)" stroke="#fdba74" stroke-width="1.5"/>
    <text x="655" y="202" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Prometheus</text>
    <text x="655" y="222" fill="#fed7aa" font-size="11" text-anchor="middle">TSDB Metrics Store (:9090)</text>
    <text x="655" y="236" fill="#ffedd5" font-size="9" text-anchor="middle">Pulls / Scrapes targets</text>
  </g>

  <!-- Loki -->
  <g filter="url(#shadow)">
    <rect x="565" y="375" width="160" height="75" rx="8" fill="url(#lokiGrad)" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="645" y="407" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Loki</text>
    <text x="645" y="427" fill="#bae6fd" font-size="11" text-anchor="middle">Log Aggregator (:3100)</text>
    <text x="645" y="441" fill="#e0f2fe" font-size="9" text-anchor="middle">Index metadata, not text</text>
  </g>

  <!-- 4. VISUALIZATION BOX -->
  <!-- Grafana -->
  <g filter="url(#shadow)">
    <rect x="900" y="270" width="190" height="95" rx="8" fill="url(#grafanaGrad)" stroke="#fde68a" stroke-width="2"/>
    <text x="995" y="308" fill="#fff" font-size="18" font-weight="800" text-anchor="middle">Grafana</text>
    <text x="995" y="330" fill="#fef3c7" font-size="12" text-anchor="middle">Dashboards &amp; Alerting</text>
    <text x="995" y="348" fill="#fffbeb" font-size="10" text-anchor="middle">Single Pane of Glass (:3000)</text>
  </g>
</svg>
